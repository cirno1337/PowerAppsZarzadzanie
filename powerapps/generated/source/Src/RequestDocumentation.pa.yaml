Screens:
  RequestDocumentation:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
    Children:
      - ScreenContainer1_RequestDocumentation:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - HeaderContainer1_RequestDocumentation:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - HeaderTitle_RequestDocumentation:
                      Control: Label@2.5.1
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Size: =16
                        Text: ="Request Documentation"
                        Width: =400
            - MainContainer1_RequestDocumentation:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - ConfirmLabel_RequestDocumentation:
                      Control: Label@2.5.1
                      Properties:
                        Size: =16
                        Text: ="Request initial documentation for " & SelectedApplication.Title & "?"
                  - ButtonsContainer_RequestDocumentation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =50
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                      Children:
                        - ConfirmButton_RequestDocumentation:
                            Control: Classic/Button@2.2.0
                            Properties:
                              OnSelect: |-
                                =Patch(
                                    DocumentationJobs,
                                    Defaults(DocumentationJobs),
                                    {
                                        Title: SelectedApplication.Title & " - DOCUMENT_APPLICATION - " & Text(Now(), "yyyy-mm-dd-hh-mm-ss"),
                                        Application: {Id: SelectedApplication.ID, Value: SelectedApplication.Title},
                                        Action: {Value: "DOCUMENT_APPLICATION", Id: 0, '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedChoice"},
                                        RequestedBy: {
                                            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
                                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                                            Department: "",
                                            DisplayName: User().FullName,
                                            Email: User().Email,
                                            JobTitle: "",
                                            Picture: ""
                                        },
                                        RequestedAt: Now(),
                                        Status: {Value: "PENDING", Id: 0, '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedChoice"},
                                        RetryCount: 0
                                    }
                                );
                                Navigate(ApplicationDetails, ScreenTransition.Cover, {SelectedApplication: SelectedApplication})
                              Text: ="Confirm"
                              Width: =120
                        - CancelButton_RequestDocumentation:
                            Control: Classic/Button@2.2.0
                            Properties:
                              OnSelect: |-
                                =Navigate(ApplicationDetails, ScreenTransition.Cover, {SelectedApplication: SelectedApplication})
                              Text: ="Cancel"
                              Width: =120
