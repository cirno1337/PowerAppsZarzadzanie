[project]
name = "power-platform-documentation-manager"
version = "0.1.0"
description = "Internal worker for documenting and versioning Power Platform applications (mock-first, offline-developable)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Only needed to run scripts/provision_sharepoint_graph.py once against a
# real tenant -- not a runtime dependency of the worker itself.
provisioning = ["msal>=1.28", "requests>=2.31"]
# Only needed when PPDM_COPILOT_MODE=real (RealCopilotAdapter's Direct
# Line HTTP calls). The mock/human_review paths have zero dependencies.
real = ["requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["worker/tests"]
pythonpath = ["."]
